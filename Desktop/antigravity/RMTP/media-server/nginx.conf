worker_processes auto;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            
            # HLS Support
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2;  # Reduced from 3s for lower latency
            hls_playlist_length 10;  # Reduced from 60s - keeps only recent segments
            hls_cleanup on;  # CRITICAL: Auto-delete old segments
            
            # Allow CORS
            # add_header Access-Control-Allow-Origin *;
        }
    }
}

http {
    server {
        listen 8080;
        
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/opt/nginx-full/share/nginx/html; # Typical brew path, may vary
        }

        # HLS Fragments
        location /hls {
            # Serve HLS fragments
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
